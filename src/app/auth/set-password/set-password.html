<div class="auth-page set-password-page">
  <div class="auth-card">
    <div class="brand-header">
      <img src="assets/images/logo.jpeg" alt="ULearn" class="brand-logo-full" />
    </div>

    <div class="card-header">
      <h1>Set your password</h1>
      <p>Your administrator created your account. Choose a new password to continue.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="password" class="form-label">New password</label>
        <div class="password-field">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            class="form-input"
            autocomplete="new-password"
            [class.error]="isFieldInvalid('password')"
          />
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" tabindex="-1">
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        @if (isFieldInvalid('password')) {
          <span class="error-message">Use at least 8 characters with upper, lower, and a number.</span>
        }
      </div>

      <div class="form-group">
        <label for="confirmPassword" class="form-label">Confirm password</label>
        <div class="password-field">
          <input
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            class="form-input"
            autocomplete="new-password"
            [class.error]="isFieldInvalid('confirmPassword') || hasPasswordMismatch()"
          />
          <button type="button" class="password-toggle" (click)="toggleConfirmPasswordVisibility()" tabindex="-1">
            {{ showConfirmPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        @if (hasPasswordMismatch()) {
          <span class="error-message">Passwords do not match.</span>
        }
      </div>

      <button type="submit" class="btn-submit" [disabled]="form.invalid || isLoading()">
        @if (isLoading()) {
          Saving…
        } @else {
          Save password
        }
      </button>
    </form>
  </div>
</div>
